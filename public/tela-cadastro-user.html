<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="assets\img\style/style.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

    <main class="d-flex flex-column align-items-center justify-content-center vh-100 gap-5">
        <div class="container" style="max-width: 600px;">

            <div class="card p-4 shadow">
                <h2 id="titulo" class="text-center mb-4">Cadastro de usuários</h2>

                <form id="form-cadastro">

                    <div class="mb-3">
                        <label for="email" class="form-label">Email</label>
                        <input type="email" id="email" class="form-control" placeholder="exemplo@123.com" required>
                    </div>

                    <div class="mb-3">
                        <label for="nmuser" class="form-label">Nome do Usuário (Login)</label>
                        <input type="user" id="user" class="form-control" placeholder="Usuário" required>
                    </div>

                    <div class="mb-3">
                        <label for="senha" class="form-label">Senha</label>
                        <input type="text" id="senha" class="form-control" placeholder="Senha" required>
                    </div>

                    <button id="button" type="submit" class="btn btn-primary w-100"
                        style="background-color: #1b3f53; color: #ffffff; border: 0cap;">
                        Cadastrar
                    </button>
                </form>

                <div id="mensagem" class="mt-3"></div>
            </div>
        </div>

    </main>

    <script src="script.js"></script>

</body>


</html>
