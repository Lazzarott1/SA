                    <div class="mb-3">
                        <label for="email" class="form-label">Email</label>
                        <input type="email" id="email" class="form-control" placeholder="exemplo@123.com" required>

                    </div>

                    <div class="mb-3">
                        <label for="senha" class="form-label">Senha</label>
                        <input type="text" id="senha" class="form-control" placeholder="Senha" required>
                    </div>

                        style="background-color: #1b3f53; color: #ffffff; border: 0cap;">
