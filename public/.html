<main class="container-fluid px-4 mt-4">
    <div class="d-flex justify-content-between align-items-end mb-4">
        <div>
            <h3 class="titulo-sensores" style="color: #1b3f53; font-weight: 500; margin-bottom: 0;">Sensores</h3>
            <p class="subtitulo-sensores" style="color: #8897B1; font-size: 0.9rem; margin-top: 4px; margin-bottom: 0;">
                Gerencie os sensores cadastrados na ferrovia
            </p>
        </div>
        <button type="button" class="btn text-white px-3 py-2 d-flex align-items-center gap-2" 
                style="background-color: #1b3f53; font-size: 0.85rem; font-weight: 600; letter-spacing: 0.5px;"
                data-bs-toggle="collapse" data-bs-target="#collapseNovoSensor" aria-expanded="false" aria-controls="collapseNovoSensor">
            <span style="font-size: 1.2rem; line-height: 1;">+</span> NOVO SENSOR
        </button>
    </div>

    <div class="collapse" id="collapseNovoSensor">
        <div class="card card-body p-0 border-0 rounded-0 mb-4" style="background-color: transparent;">
            
            <div class="px-3 py-2 border-bottom" style="background-color: #D9E2EC; border: 1px solid #BCCCDC!important;">
                <span style="color: #486581; font-size: 0.75rem; font-weight: 700; letter-spacing: 0.5px;">CADASTRAR NOVO SENSOR</span>
            </div>

            <form class="p-4 bg-white" style="border: 1px solid #BCCCDC; border-top: none;">
                <div class="row g-4 mb-4">
                    <div class="col-md-6">
                        <label for="nomeSensor" class="form-label" style="color: #486581; font-size: 0.75rem; font-weight: 700; letter-spacing: 0.5px;">
                            NOME DO SENSOR *
                        </label>
                        <input type="text" class="form-control rounded-1" id="nomeSensor" placeholder="Ex: Sensor-001" 
                               style="border-color: #BCCCDC; color: #486581; padding: 0.6rem;">
                    </div>
                    
                    <div class="col-md-6">
                        <label for="categoriaSensor" class="form-label" style="color: #486581; font-size: 0.75rem; font-weight: 700; letter-spacing: 0.5px;">
                            CATEGORIA *
                        </label>
                        <select class="form-select rounded-1" id="categoriaSensor" style="border-color: #BCCCDC; color: #486581; padding: 0.6rem;">
                            <option selected disabled>Selecione...</option>
                            <option value="1">Temperatura</option>
                            <option value="2">Vibração</option>
                            <option value="3">Presença</option>
                        </select>
                    </div>
                </div>

                <div class="d-flex justify-content-end gap-3 mt-4">
                    <button type="button" class="btn bg-white rounded-1 px-4 py-2" 
                            style="border: 1px solid #BCCCDC; color: #627D98; font-size: 0.75rem; font-weight: 700; letter-spacing: 0.5px;"
                            data-bs-toggle="collapse" data-bs-target="#collapseNovoSensor">
                        CANCELAR
                    </button>
                    <button type="submit" class="btn rounded-1 text-white px-4 py-2" 
                            style="background-color: #718EA9; border: none; font-size: 0.75rem; font-weight: 700; letter-spacing: 0.5px;">
                        CADASTRAR SENSOR
                    </button>
                </div>
            </form>

        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <div></div>
</main>
